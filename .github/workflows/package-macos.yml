name: Package macOS
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Target draft release for the verified installers
        required: true
        type: string
      dependency_release_tag:
        description: Persistent release containing the pinned dependency snapshot
        required: false
        default: build-inputs-v1
        type: string
      dependency_sha256:
        description: Verified SHA-256 of runtime-dependencies-ci.zip
        required: false
        default: '47c608438c97af8a96533e4ff66c6c78f90586d59cf0ec3cd9b396e71d47b015'
        type: string
      reuse_run_id:
        description: Optional previous run with identical application source (test-only fixes)
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      dependency_sha256:
        required: false
        default: '47c608438c97af8a96533e4ff66c6c78f90586d59cf0ec3cd9b396e71d47b015'
        type: string
      dependency_release_tag:
        required: false
        default: build-inputs-v1
        type: string
      reuse_run_id:
        required: false
        default: ''
        type: string
permissions:
  contents: write
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore verified dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.dependency_release_tag }}
          EXPECTED_SHA: ${{ inputs.dependency_sha256 }}
        run: |
          mkdir -p artifacts/input
          gh release download "$RELEASE_TAG" --pattern 'runtime-dependencies-ci.zip' --dir artifacts/input
          echo "$EXPECTED_SHA  artifacts/input/runtime-dependencies-ci.zip" | shasum -a 256 -c -
          unzip -q artifacts/input/runtime-dependencies-ci.zip
      - name: Restore platform CLIs and packaging tools
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          test "$(node -p process.arch)" = "$TARGET_ARCH"
          mkdir -p .runtime/packaging .runtime/mac-cli
          cp scripts/packaging/package*.json .runtime/packaging/
          npm ci --prefix .runtime/packaging --no-audit --no-fund
          npm ci --prefix .runtime --ignore-scripts --no-audit --no-fund
          npm install --prefix .runtime/mac-cli --no-audit --no-fund "@openai/codex@0.156.1-darwin-$TARGET_ARCH" "@vscode/ripgrep-darwin-$TARGET_ARCH@1.18.0" "@github/copilot-darwin-$TARGET_ARCH@1.0.69" "sherpa-onnx-darwin-$TARGET_ARCH@1.13.7" "@lydell/node-pty-darwin-$TARGET_ARCH@1.1.0" "@wecom/cli-darwin-$TARGET_ARCH@0.1.9"
          mv .runtime/mac-cli/node_modules/@openai/codex "node_modules/@openai/codex-darwin-$TARGET_ARCH"
          cp -R .runtime/mac-cli/node_modules/. node_modules/
          npm run build
      - name: Build DMG and ZIP
        if: inputs.reuse_run_id == ''
        run: node scripts/package-macos.mjs
      - name: Restore existing images for test-only changes
        if: inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          for attempt in {1..20}; do
            if gh run download "$REUSE_RUN_ID" --name "ShineAI-macos-$TARGET_ARCH" --dir artifacts/installer-mac; then
              break
            fi
            sleep 15
          done
          test -f artifacts/installer-mac/package-report.json
          cd artifacts/installer-mac
          shasum -a 256 -c ./*.sha256
          cd ../..
          previous=$(node -p "JSON.parse(require('fs').readFileSync('artifacts/installer-mac/package-report.json')).commit")
          gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA" --jq '.files[].filename' > artifacts/reused-image-changes.txt
          if grep -Eq '^(src/|resources/|dependencies\.lock\.json|package\.json|scripts/package-macos\.mjs|scripts/packaging/|\.runtime/package)' artifacts/reused-image-changes.txt; then
            echo 'Application input changed; refuse to reuse installation images'
            exit 1
          fi
      - name: Exercise packaged app
        run: node scripts/macos-package-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ShineAI-macos-${{ matrix.arch }}
          path: |
            artifacts/installer-mac/*.dmg
            artifacts/installer-mac/*.zip
            artifacts/installer-mac/*.sha256
            artifacts/installer-mac/*.json
            artifacts/installer-mac/*.png
          compression-level: 0
          retention-days: 3
          if-no-files-found: warn
      - name: Upload tested installation images
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          shopt -s nullglob
          gh release upload "$RELEASE_TAG" artifacts/installer-mac/*.dmg artifacts/installer-mac/*.zip artifacts/installer-mac/*.sha256 --clobber
